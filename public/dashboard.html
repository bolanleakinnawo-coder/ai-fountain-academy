<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard · AI Fountain Academy</title>
  <meta name="description" content="Your AI Fountain Academy dashboard.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
    /* Animations run only when the page scripts start. If they can't (for example
       the file was opened straight from disk), show the content and explain why. */
    (function () {
      var h = document.documentElement;
      h.classList.add("anim");
      setTimeout(function () {
        if (h.classList.contains("is-ready")) return;
        h.classList.remove("anim");
        var l = document.querySelector(".page-loader");
        if (l) l.classList.add("done");
        if (location.protocol === "file:") {
          var n = document.createElement("div");
          n.className = "file-note";
          n.innerHTML = "<strong>Open this site through a local server, not by double-clicking</strong>Browsers block a website's scripts when the HTML file is opened straight from your computer, so menus, courses and logins can't load. In VS Code, install the <code>Live Server</code> extension, right-click <code>public/index.html</code> and choose <code>Open with Live Server</code>. Full steps are in <code>HOW-TO-PREVIEW.txt</code>.";
          document.body.appendChild(n);
        }
      }, 3000);
    })();
  </script>
  <link rel="stylesheet" href="assets/css/core.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="page-loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-drop"><i></i><i></i><i></i><b></b></div>
      <div class="loader-word"><span style="animation-delay:.05s">AI</span>&nbsp;<span style="animation-delay:.12s">Fountain</span>&nbsp;<span style="animation-delay:.19s;color:var(--blue)">Academy</span></div>
      <div class="loader-bar"></div>
    </div>
  </div>
  <div class="app">
    <div data-app-sidebar data-active="overview"></div>
    <main class="app-main" id="main">
      <header class="app-head">
        <div>
          <p class="muted" id="hello-time">Welcome</p>
          <h1 class="h2" id="hello-name"><span class="skel skel-title" style="display:inline-block;width:260px"></span></h1>
        </div>
        <a href="courses.html" class="btn btn-ghost btn-sm hide-sm">Browse catalogue</a>
      </header>

      <section id="continue-slot"></section>

      <section class="dash-section" id="hot-slot"></section>

      <section class="dash-section" id="enrolled">
        <div class="dash-head">
          <div><p class="kicker">What's on your desk</p><h2>Your enrolled courses</h2></div>
        </div>
        <div class="search-box dash-search">
          <input class="input" id="enrolled-search" type="search" placeholder="Search enrolled courses" aria-label="Search enrolled courses">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="enrolled-grid" id="enrolled-grid"></div>
      </section>

      <section class="dash-section" id="explore">
        <div class="dash-head">
          <div><p class="kicker">Discover more courses</p><h2>Explore courses <span class="filter-tag hidden" id="filter-tag"></span></h2></div>
          <a href="courses.html" class="show-all">Show all <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
        <div class="explore-grid" id="explore-grid"></div>
      </section>

      <section class="dash-section categories" id="categories">
        <div class="dash-head">
          <div><p class="kicker">Categories</p><h2 class="big">Dive into an area that excites you</h2></div>
          <div class="carousel-btns">
            <button class="round-btn" id="cat-prev" aria-label="Previous categories"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m10 3-5 5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="round-btn" id="cat-next" aria-label="Next categories"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div class="cat-track" id="cat-track"></div>
      </section>
    </main>
  </div>
  <script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
