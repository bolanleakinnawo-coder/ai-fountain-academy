<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; font-family: "Inter Display", Inter, sans-serif; }

  .t.navy { background: #07144a; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 64px 64px; }

  .copy { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 560px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; }
  .brand i { width: 26px; height: 26px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: #fff; }
  .brand small { font-family: "DejaVu Sans Mono", monospace; font-weight: 400; font-size: 13px; letter-spacing: .14em; opacity: .8; border: 1px solid rgba(255,255,255,.35); padding: 3px 8px; border-radius: 6px; }
  .cat { margin-top: auto; font-family: "DejaVu Sans Mono", monospace; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; display: flex; gap: 12px; align-items: center; }
  .cat b { background: #fff; color: #1f5bff; padding: 4px 10px; border-radius: 6px; font-weight: 700; letter-spacing: .05em; }
  .navy .cat b { background: #ff3b3b; color: #fff; }
  h1 { font-size: 66px; line-height: .98; letter-spacing: -0.045em; font-weight: 800; margin-top: 18px; }
  h1 em { font-style: normal; color: #9fb9ff; }
  .navy h1 em { color: #5d8bff; }
  .sub { margin-top: 18px; font-size: 24px; opacity: .85; font-weight: 500; letter-spacing: -0.01em; }
  .art { position: absolute; right: 40px; top: 50%; transform: translateY(-50%) scale(.9); transform-origin: right center; width: 540px; height: 540px; }
  .num { position: absolute; right: 64px; bottom: 44px; font-family: "DejaVu Sans Mono", monospace; font-size: 18px; opacity: .6; letter-spacing: .1em; }
